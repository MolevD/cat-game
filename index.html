<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кошка в квартире</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            background: linear-gradient(180deg, #f8e5c8 0%, #f0d8b0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            background-color: #ffffff;
            border: 3px solid #333;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const groundY = 350;
        const gravity = 0.6;
        const jumpPower = -12;
        const gameSpeed = 4;

        // Кошка
        const catX = 100;
        const catWidth = 60;
        const catHeight = 50;
        let catY = groundY - catHeight;
        let catVelocityY = 0;
        let isJumping = false;
        let catColor = 'orange';

        // Препятствия
        let obstacles = [];
        const obstacleTypes = [
            { kind: 'tapok', width: 30, height: 30 },
            { kind: 'ball',  width: 26, height: 26 },
            { kind: 'yarn',  width: 28, height: 28 }
        ];
        let obstacleTimer = 0;
        let nextObstacleIn = 100;

        // Мышки
        let mice = [];
        const mouseWidth = 28;
        const mouseHeight = 28;
        const mouseBonus = 3;
        let mouseTimer = 0;
        let nextMouseIn = 200;

        let score = 0;
        let isGameOver = false;
        let gameState = 'menu';

        const isTouchDevice = 'ontouchstart' in window;

        // =========================================================
        //                    ФУНКЦИИ РИСОВАНИЯ
        // =========================================================

        // Универсальная функция для эмодзи
        function drawEmoji(emoji, x, y, size) {
            ctx.font = size + 'px serif';
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            ctx.fillText(emoji, x, y);
        }

        // Кошка (по-прежнему из фигур — чтобы можно было выбирать цвет)
        function drawCat(x, y, color) {
            const main   = color === 'gray' ? '#a0a0a0' : '#ff8c42';
            const accent = color === 'gray' ? '#d0d0d0' : '#ffb380';

            // Тело (овал)
            ctx.fillStyle = main;
            ctx.beginPath();
            ctx.ellipse(x + 25, y + 35, 22, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            // Хвост
            ctx.beginPath();
            ctx.ellipse(x + 5, y + 28, 10, 4, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Голова (круг)
            ctx.beginPath();
            ctx.arc(x + 45, y + 22, 13, 0, Math.PI * 2);
            ctx.fill();

            // Уши
            ctx.beginPath();
            ctx.moveTo(x + 36, y + 12);
            ctx.lineTo(x + 39, y + 2);
            ctx.lineTo(x + 44, y + 11);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + 46, y + 11);
            ctx.lineTo(x + 51, y + 2);
            ctx.lineTo(x + 54, y + 12);
            ctx.closePath();
            ctx.fill();

            // Розовое внутри ушей
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(x + 39, y + 10);
            ctx.lineTo(x + 41, y + 5);
            ctx.lineTo(x + 43, y + 10);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + 48, y + 10);
            ctx.lineTo(x + 50, y + 5);
            ctx.lineTo(x + 52, y + 10);
            ctx.closePath();
            ctx.fill();

            // Глаза
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 41, y + 21, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 49, y + 21, 2, 0, Math.PI * 2);
            ctx.fill();

            // Нос
            ctx.fillStyle = '#d94a4a';
            ctx.beginPath();
            ctx.moveTo(x + 45, y + 25);
            ctx.lineTo(x + 43, y + 27);
            ctx.lineTo(x + 47, y + 27);
            ctx.closePath();
            ctx.fill();

            // Лапки
            ctx.fillStyle = main;
            ctx.fillRect(x + 10, y + 45, 5, 5);
            ctx.fillRect(x + 20, y + 45, 5, 5);
            ctx.fillRect(x + 32, y + 45, 5, 5);
            ctx.fillRect(x + 42, y + 45, 5, 5);
        }

        // =========================================================
        //                       ЛОГИКА ИГРЫ
        // =========================================================

        function handleAction() {
            if (gameState === 'menu') return;
            if (isGameOver) {
                resetGame();
            } else if (!isJumping) {
                catVelocityY = jumpPower;
                isJumping = true;
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                handleAction();
            }
        });

        document.addEventListener('touchstart', function(event) {
            if (gameState === 'menu') return;
            event.preventDefault();
            handleAction();
        }, { passive: false });

        document.addEventListener('mousedown', function(event) {
            if (gameState === 'menu') return;
            handleAction();
        });

        function resetGame() {
            catY = groundY - catHeight;
            catVelocityY = 0;
            isJumping = false;
            obstacles = [];
            mice = [];
            obstacleTimer = 0;
            nextObstacleIn = 100;
            mouseTimer = 0;
            nextMouseIn = 200;
            score = 0;
            isGameOver = false;
        }

        function isColliding(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function spawnObstacle() {
            const typeIndex = Math.floor(Math.random() * obstacleTypes.length);
            const type = obstacleTypes[typeIndex];
            obstacles.push({
                x: canvas.width,
                y: groundY - type.height,
                width: type.width,
                height: type.height,
                kind: type.kind
            });
        }

        function spawnMouse() {
            mice.push({
                x: canvas.width,
                y: groundY - catHeight - 30,
                width: mouseWidth,
                height: mouseHeight
            });
        }

        function update() {
            if (gameState !== 'playing') return;
            if (isGameOver) return;

            catVelocityY = catVelocityY + gravity;
            catY = catY + catVelocityY;
            if (catY >= groundY - catHeight) {
                catY = groundY - catHeight;
                catVelocityY = 0;
                isJumping = false;
            }

            obstacleTimer++;
            if (obstacleTimer >= nextObstacleIn) {
                spawnObstacle();
                obstacleTimer = 0;
                nextObstacleIn = 80 + Math.floor(Math.random() * 80);
            }

            mouseTimer++;
            if (mouseTimer >= nextMouseIn) {
                spawnMouse();
                mouseTimer = 0;
                nextMouseIn = 150 + Math.floor(Math.random() * 200);
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= gameSpeed;
            }
            for (let i = 0; i < mice.length; i++) {
                mice[i].x -= gameSpeed;
            }

            const cat = { x: catX, y: catY, width: catWidth, height: catHeight };

            for (let i = 0; i < obstacles.length; i++) {
                if (isColliding(cat, obstacles[i])) {
                    isGameOver = true;
                }
            }

            mice = mice.filter(function(mouse) {
                if (isColliding(cat, mouse)) {
                    score += mouseBonus;
                    return false;
                }
                return true;
            });

            const beforeCount = obstacles.length;
            obstacles = obstacles.filter(function(obs) {
                return obs.x + obs.width > 0;
            });
            score += (beforeCount - obstacles.length);

            mice = mice.filter(function(mouse) {
                return mouse.x + mouse.width > 0;
            });
        }

        // --- Меню выбора кошки ---
        const menuCats = [
            { x: 280, y: 180, color: 'orange' },
            { x: 460, y: 180, color: 'gray'   }
        ];

        function drawMenu() {
            ctx.fillStyle = '#f8e5c8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.font = 'bold 36px Arial';
            ctx.fillText('Выбери кошку', canvas.width / 2, 80);

            ctx.font = '18px Arial';
            ctx.fillText('нажми на кошку, чтобы начать', canvas.width / 2, 115);

            for (let i = 0; i < menuCats.length; i++) {
                const mc = menuCats[i];
                ctx.fillStyle = '#fff5e6';
                ctx.beginPath();
                ctx.arc(mc.x + 30, mc.y + 35, 65, 0, Math.PI * 2);
                ctx.fill();
                drawCat(mc.x, mc.y, mc.color);
            }

            ctx.textAlign = 'left';
        }

        function handleMenuClick(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width  / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top ) * scaleY;

            for (let i = 0; i < menuCats.length; i++) {
                const mc = menuCats[i];
                const cx = mc.x + 30;
                const cy = mc.y + 35;
                const dx = x - cx;
                const dy = y - cy;
                if (dx * dx + dy * dy <= 65 * 65) {
                    catColor = mc.color;
                    gameState = 'playing';
                    resetGame();
                    return;
                }
            }
        }

        canvas.addEventListener('click', function(event) {
            if (gameState === 'menu') {
                handleMenuClick(event.clientX, event.clientY);
            }
        });

        canvas.addEventListener('touchend', function(event) {
            if (gameState === 'menu') {
                event.preventDefault();
                const touch = event.changedTouches[0];
                handleMenuClick(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        function draw() {
            if (gameState === 'menu') {
                drawMenu();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f8e5c8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#8b6f47';
            ctx.fillRect(0, groundY, canvas.width, 50);

            drawCat(catX, catY, catColor);

            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                let emoji = '🥿';
                if (obs.kind === 'ball') emoji = '⚽';
                if (obs.kind === 'yarn') emoji = '🧶';
                drawEmoji(emoji, obs.x, obs.y, obs.width);
            }

            for (let i = 0; i < mice.length; i++) {
                const m = mice[i];
                drawEmoji('🐭', m.x, m.y, m.width);
            }

            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'right';
            ctx.fillText('Счёт: ' + score, canvas.width - 20, 35);
            ctx.textAlign = 'left';

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.font = 'bold 48px Arial';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = '20px Arial';
                ctx.fillText('Счёт: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                const hint = isTouchDevice ? 'Коснись экрана, чтобы играть заново' : 'Нажми Пробел, чтобы играть заново';
                ctx.fillText(hint, canvas.width / 2, canvas.height / 2 + 55);

                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
